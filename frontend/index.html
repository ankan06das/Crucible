    <style>
        .neon-glow-primary {
            box-shadow: 0 0 15px rgba(126, 189, 240, 0.2);
        }
        .neon-glow-secondary {
            box-shadow: 0 0 15px rgba(242, 158, 183, 0.2);
        }
        .glow-divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 4px rgba(255, 255, 255, 0.08);
        }
        .scanline:focus-within::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: #7ebdf0;
            box-shadow: 0 0 8px #7ebdf0;
            animation: scan 2s linear infinite;
        }
        @keyframes scan {
            0% { transform: scaleX(0); transform-origin: left; }
            50% { transform: scaleX(1); transform-origin: left; }
            50.1% { transform: scaleX(1); transform-origin: right; }
            100% { transform: scaleX(0); transform-origin: right; }
        }
        .ai-pulse {
            animation: pulse-opacity 2s infinite ease-in-out;
        }
        @keyframes pulse-opacity {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #121314;
        }
        ::-webkit-scrollbar-thumb {
            background: #2b2e33;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #7ebdf0;
        }
    </style>

  <body class="bg-background text-on-surface min-h-screen flex flex-col md:flex-row overflow-x-hidden font-body-md">
    <div id="root" class="w-full flex min-h-screen"></div>
